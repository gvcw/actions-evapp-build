name: "ev-app build"
description: "build ev-app"
inputs: 
  MAVEN_VERSION:
    required: true
    default: 3.8.6
  JAVA_VERSION:
    required: true
    default: 1.8
  REGISTRY:
    required: true
    default: "gvcwapp.azurecr.io"
  REGISTRY_PASSWORD:
    required: true
  EV_APP:
    required: true
  TAGS:
    required: true
  SM_API_KEY:
    required: false
  SM_CLIENT_CERT_PASSWORD:
    required: false

runs:
  using: "composite"
  steps:
    # - name: Set tag ref
    #   shell: bash
    #   run: |
    #     echo DOCKER_TAGS_APP=${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}/app:latest,${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}/app:$(echo ${{ inputs.TAGS }} | sed 's#,#,${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}/app:#g') >> $GITHUB_ENV
    #     echo DOCKER_TAGS_SCHEDULER=${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}/scheduler:latest,${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}/scheduler:$(echo ${{ inputs.TAGS }} | sed 's#,#,${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}/scheduler:#g') >> $GITHUB_ENV        


    - name: Docker meta
      id: meta-app
      uses: docker/metadata-action@v4
      with:
        images: |
          ${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}/app
        tags: |
          type=ref,event=branch
          type=match,pattern=deploy-(.*),group=1,value={{branch}},event=branch
          type=match,pattern=pgeor-(.*)ci,group=1,value={{branch}},event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=sha,prefix=
          type=raw,value=latest

    - name: Docker meta
      id: meta-scheduler
      uses: docker/metadata-action@v4
      with:
        images: |
          ${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}/scheduler
        tags: |
          type=ref,event=branch
          type=match,pattern=deploy-(.*),group=1,value={{branch}},event=branch
          type=match,pattern=pgeor-(.*)ci,group=1,value={{branch}},event=branch
          type=ref,event=pr
          type=ref,event=tag
          type=sha,prefix=
          type=raw,value=latest

    - name: show tags
      shell: bash
      run: |
        echo app: 
        echo "${{ steps.meta-app.outputs.tags }}"
        echo scheduler: 
        echo "${{ steps.meta-scheduler.outputs.tags }}"

    - name: Set up Maven
      uses: stCarolas/setup-maven@v4.5
      with:
        maven-version: ${{ inputs.MAVEN_VERSION}}

    - name: versions mvn
      shell: bash
      run: |
        mvn --version

    - uses: actions/setup-java@v1
      with:
        java-version: ${{ inputs.JAVA_VERSION}}

    - name: versions java
      shell: bash
      run: |
        java -version

    - name: Cache mvn packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.OS }}-mvn-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.OS }}-mvn-
          ${{ runner.OS }}-

    - name: build deps
      shell: bash
      run: |
        cd builddeps
        . installdeps.sh
        . installcomm.sh

# [ -f code_signing_tools/linux_x64/env ] && . code_signing_tools/linux_x64/env
# export SM_API_KEY=${{ inputs.SM_API_KEY }}
# export SM_CLIENT_CERT_PASSWORD=${{ inputs.SM_CLIENT_CERT_PASSWORD }}
# echo PATH=$PATH
# echo SM_API_KEY=$(echo $SM_API_KEY | sed 's/.$//')
# echo SM_CLIENT_CERT_PASSWORD=$(echo $SM_CLIENT_CERT_PASSWORD | sed 's/.$//')
# env | grep SM_
    - name: mvn build
      shell: bash
      run: |
        mvn -B -e install -Ddockerfile.skip dependency:copy-dependencies 
      #-PPublicSigning
      #-pl app,frontend,scheduler -am


    # - name: test
    #   shell: bash
    #   run: |
    #     [ -f code_signing_tools/linux_x64/env ] && . code_signing_tools/linux_x64/env
    #     export SM_API_KEY=${{ inputs.SM_API_KEY }}
    #     export SM_CLIENT_CERT_PASSWORD=${{ inputs.SM_CLIENT_CERT_PASSWORD }}
    #     echo PATH=$PATH
    #     echo SM_API_KEY=$(echo $SM_API_KEY | sed 's/.$//')
    #     echo SM_CLIENT_CERT_PASSWORD=$(echo $SM_CLIENT_CERT_PASSWORD | sed 's/.$//')
    #     env | grep SM_
    #     cd /home/runner/work/ev-app/ev-app/mrzclient 
    #     /opt/hostedtoolcache/jdk/8.0.482/x64/jre/../bin/jarsigner -verbose -keystore NONE -storepass 'itcLW1UrMkaU' -storetype PKCS11 -providerClass sun.security.pkcs11.SunPKCS11 -providerArg ../code_signing_tools/linux_x64/pkcs11properties.cfg -J-Dfile.encoding=UTF-8 -tsa http://timestamp.digicert.com /home/runner/work/ev-app/ev-app/mrzclient/target/mrzclient.jar key_1461487827

    - name: Setup Software Trust Manager
      uses: digicert/code-signing-software-trust-action@v1
      with:
        simple-signing-mode: true
        # If the below 2 parameters are supplied, then smctl executable is invoked to attempt the signing.
        input: ./app/target/frontenddist/jnlp/
        keypair-alias: "key_1461487827"
      env:
        SM_HOST: "https://clientauth.one.digicert.com"
        SM_API_KEY: ${{ inputs.SM_API_KEY }}
        SM_CLIENT_CERT_FILE: "code_signing_tools/gvcw-ci-cert.p12"
        SM_CLIENT_CERT_PASSWORD: ${{ inputs.SM_CLIENT_CERT_PASSWORD }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.REGISTRY }}
        username: gvcwapp
        password: ${{ inputs.REGISTRY_PASSWORD }}
    
    - name: Build and push app
      uses: docker/build-push-action@v6
      with:
        context: app
        push: true
        file: app/Dockerfile-nojar
        cache-from: ${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}:latest
        tags: ${{ steps.meta-app.outputs.tags }}
        labels: ${{ steps.meta-scheduler.outputs.labels }}
 
    - name: Build and push scheduler
      uses: docker/build-push-action@v6
      with:
        context: scheduler
        push: true
        file: scheduler/Dockerfile-nojar
        cache-from: ${{ inputs.REGISTRY }}/${{ inputs.EV_APP }}:latest
        tags: ${{ steps.meta-scheduler.outputs.tags }}
        labels: ${{ steps.meta-scheduler.outputs.labels }}
